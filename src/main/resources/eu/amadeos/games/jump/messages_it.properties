dialog.about.text=Corri e salta attraverso tre livelli disegnati con l'editor di mappe Tiled: un prato, delle grotte e una salita fino alle nuvole. I tuoi tempi migliori e le monete vengono salvati.
dialog.about.rules=Raccogli le monete, salta su scarafaggi e uccelli dall'alto e raggiungi la bandiera rossa. Spine, acqua e burroni ti rimandano all'ultima bandiera verde. Tieni premuto il tasto di salto per saltare più in alto; P mette in pausa, F11 passa a schermo intero e ritorna.
