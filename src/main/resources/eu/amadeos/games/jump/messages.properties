dialog.about.text=Run and jump through three levels drawn with the Tiled map editor: a meadow, caves and a climb into the clouds. Your best times and coins are saved.
dialog.about.rules=Take the coins, jump on beetles and birds from above, and reach the red flag. Spikes, water and pits send you back to the last green flag. Hold the jump key for higher jumps; P pauses, F11 switches to full screen and back.
