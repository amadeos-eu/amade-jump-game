dialog.about.text=Lauf und spring durch drei Level, gezeichnet mit dem Karteneditor Tiled: eine Wiese, Höhlen und ein Aufstieg in die Wolken. Deine Bestzeiten und Münzen werden gespeichert.
dialog.about.rules=Sammle die Münzen, spring Käfern und Vögeln von oben auf den Kopf und erreiche die rote Fahne. Stacheln, Wasser und Abgründe schicken dich zur letzten grünen Fahne zurück. Halte die Sprungtaste für höhere Sprünge; P hält an, F11 schaltet ins Vollbild und zurück.
